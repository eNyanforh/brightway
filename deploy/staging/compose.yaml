name: brightway-private-staging
x-runtime: &runtime
  image: brightway-staging-api:${BRIGHTWAY_REVISION:?Set the reviewed source SHA}
  build:
    context: ../..
    target: api
  env_file: .env.staging
  environment:
    NODE_ENV: production
    BRIGHTWAY_STAGE: private-staging
    PORT: "5000"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  api:
    <<: *runtime
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  web:
    image: brightway-staging-web:${BRIGHTWAY_REVISION:?Set the reviewed source SHA}
    build:
      context: ../..
      target: web
    ports: ["127.0.0.1:8443:8443"]
    secrets: [staging_cert, staging_key]
    healthcheck:
      test: [CMD, wget, --no-check-certificate, -q, -O, /dev/null, "https://127.0.0.1:8443/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  cleanup:
    <<: *runtime
    command: [node, backend/scripts/identity-cleanup-worker.js]
    volumes: [cleanup_state:/state]
    stop_grace_period: 12m
    healthcheck:
      test: [CMD, node, backend/scripts/check-cleanup-heartbeat.js]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 60s
secrets:
  staging_cert:
    file: ${STAGING_TLS_CERT:?Set an existing private staging certificate path}
  staging_key:
    file: ${STAGING_TLS_KEY:?Set an existing private staging key path}
volumes:
  cleanup_state:
